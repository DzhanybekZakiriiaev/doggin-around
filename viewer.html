<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Walk · viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/viewer.css" />
    <link rel="stylesheet" href="/src/game/game.css" />
  </head>
  <body>
    <div id="hud">
      <label>World <select id="world-select"></select></label>
      <label>Splats <select id="res-select">
        <option value="500k">500k</option>
        <option value="100k">100k</option>
        <option value="full_res">Full</option>
      </select></label>
      <label>Look speed <input id="look-speed" type="range" min="0.2" max="2.5" step="0.1" value="1" /></label>
      <label><input id="drag-toggle" type="checkbox" /> Drag to look</label>
      <label><input id="hands-toggle" type="checkbox" /> Hands (H)</label>
      <label><input id="splat-hands-toggle" type="checkbox" /> Splat hands</label>
      <label><input id="rain-toggle" type="checkbox" /> Rain</label>
      <label>Try <select id="hand-action"><option value="">hand animation…</option></select></label>
      <label><input id="collider-toggle" type="checkbox" /> Collider (C)</label>
      <label><input id="fly-toggle" type="checkbox" /> Fly (F)</label>
      <div id="status">Loading…</div>
    </div>

    <div id="fps"></div>
    <div id="crosshair"></div>
    <div id="prompt"></div>
    <div id="hint"></div>

    <div id="transition"><div class="ink"></div><div class="sfx"></div></div>

    <div id="start">
      <p class="title">Click to walk</p>
      <p>Mouse (or drag) / arrow keys look · WASD move · Shift run · Space jump · E interact / pick up</p>
      <p>T or click throw (Biscuit fetches) · G put down · V call Biscuit · F fly (E/Q up/down) · H hands · C collider · R respawn · Esc release</p>
    </div>

    <script type="module" src="/src/viewer.ts"></script>
  </body>
</html>
